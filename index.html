<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GIF Search Engine</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>

        <h1>GIF Search Engine</h1>

        <nav>

            <a href="#">Home</a>
            <a href="#">Trending</a>
            <a href="#">About</a>
            <a href="#">Contact</a>

        </nav>

    </header>

 <!-- Hero Section -->
<section class="hero">

    <h2>Find Your Perfect GIF</h2>

    <p>
        Search millions of GIFs instantly using the GIPHY API.
        Enter any keyword below and discover funny, trending,
        or animated GIFs in seconds.
    </p>

</section>

<div class="search-card">

<!-- Search Form -->
    <form id="search-form">

        <input
            type="search"
            id="search-input"
            placeholder="Search for GIFs..."
            required>

        <button type="submit">
            Search
        </button>

    </form>

    </div>
<!-- GIF Results -->
    <div id="results"></div>

   <script src="js/main.js"></script>

</body>

</html>
